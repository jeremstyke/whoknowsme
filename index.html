:root{--sun:#ffdd4a;--ink:#1d1238;--paper:#fffdf6;--coral:#ff5c8a;--blue:#3d7bff;--mint:#22c993;--violet:#8b5cf6;--orange:#ff9f1c;--mute:#6b6080}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--sun);color:var(--ink);font:17px/1.45 Nunito,ui-rounded,system-ui,sans-serif}
body{background:var(--sun) radial-gradient(rgba(29,18,56,.07) 1.5px,transparent 1.6px) 0 0/22px 22px;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.w{max-width:480px;margin:0 auto;padding:16px 16px 36px}

.lead{text-align:center;font-weight:800;margin:0 0 4px}

.btn:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
.btn.go{background:var(--coral);color:#fff}.btn.wa{background:#25d366;color:#fff}.btn.tg{background:#2aabee;color:#fff}.btn.ink{background:var(--ink);color:var(--sun)}

      <div class="dots">${Array.from({ length: n }, (_, k) => `<i class="${k <= i ? 'on' : ''}"></i>`).join('')}</div>
      <p class="q"><small>${esc(t('guessWhat', { name }))}</small>${esc(qq.q)}</p><div class="opts">${[0, 1, 2, 3].map((k) => `<div class="opt" data-k="${k}"><b>${qq.e[k]}</b>${esc(qq.o[k])}</div>`).join('')}</div>`;
    $('qx').onclick = home;
    app.querySelectorAll('.opt').forEach((o) => o.onclick = () => { haptic(); guesses.push(Number(o.dataset.k)); step(i + 1); });
  };
  $('go').onclick = () => { haptic('medium'); step(0); };
}
function result(qz, score, guesses, answers, b, rank, total) {
  window.scrollTo(0, 0);
  const name = qz.owner, n = nOf(qz), v = score >= n * 0.8 ? 'vHi' : score >= n * 0.5 ? 'vMid' : 'vLo';
  app.innerHTML = `<div class="stk" style="text-align:center"><div class="score">${score}/${n}</div><h1 style="font-size:26px">${esc(t(v, { name }))}</h1>${rank ? `<span class="badge">${esc(t('rank', { r: rank, t: total }))}</span>` : ''}</div>
    <button class="btn go" id="mk">${esc(t('yours'))}</button>
    <button class="btn" id="ch">${esc(t('challenge'))}</button>
    <div class="stk" style="margin-top:20px"><h2>🏆 ${esc(name)}</h2>${board(b, n)}</div>
    <div class="stk"><h2>${esc(t('answers'))}</h2>${Array.from({ length: n }, (_, i) => { const qq = qOf(qz, i); return `<div class="ans"><span>${guesses[i] === answers[i] ? '✅' : '❌'}</span><div>${esc(qq.q)}<br><b>${qq.e[answers[i]]} ${esc(qq.o[answers[i]])}</b>${guesses[i] !== answers[i] ? ` <em>(${esc(t('you'))} : ${esc(qq.o[guesses[i]])})</em>` : ''}</div></div>`; }).join('')}</div>${foot}`;
  $('mk').onclick = () => { api('ev', { k: 'make_yours' }).catch(() => {}); createFlow(); };
  $('ch').onclick = () => shareSheetFor(qz.id, t('challengeText', { s: score + '/' + n, name }));
}

// ===== start: Telegram players are known; web visitors give their first name once =====
async function start() {
  try { const [s1, d1] = await Promise.all([api('state'), api('today').catch(() => null)]); st = s1; dailyPre = d1; } catch (e) { if (!IN_TG) { TOKEN = ''; try { localStorage.removeItem('km_token'); } catch (er) {} return boot(); } app.innerHTML = `<div class="heart">😕</div><p class="lead">${esc(t('err'))}</p>`; return; }
  if (st.me && st.me.lang && S[st.me.lang]) { lang = st.me.lang; document.documentElement.lang = lang; }
  const sp = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || '';
  const qid = (new URLSearchParams(location.search).get('q') || (sp.startsWith('q_') ? sp.slice(2) : '')).replace(/[^a-z0-9]/g, '');
  if (qid) {
    try {
      const qz = await api('quiz', { id: qid });
      if (qz.mine) { toast(t('mine')); return home(); }
      if (qz.done) return result(qz, qz.done.score, qz.done.guesses, qz.done.answers, qz.board, qz.board.findIndex((b) => b.score === qz.done.score) + 1, qz.board.length);
      return playFlow(qz);
    } catch (e) { toast(t('noquiz')); }
  }
  home();
}
function boot() {
  if (IN_TG || TOKEN) return start();
  const qid = new URLSearchParams(location.search).get('q');
  app.innerHTML = `<div class="heart">${qid ? '👀' : '💛'}</div><h1>${esc(qid ? t('invT0') : t('title'))}</h1><p class="lead">${esc(qid ? t('invSub0') : t('sub'))}</p>
    <input class="inp" id="nm" maxlength="30" placeholder="${esc(t('yourName'))}" autocomplete="given-name"><button class="btn go" id="ngo">${esc(t('goOn'))}</button>
    <a class="link" href="https://t.me/${BOTU}">${esc(t('playTg'))}</a>${foot}`;
  const go = async () => {
    const name = $('nm').value.trim(); if (name.length < 2) return toast(t('nameNeed'));
    $('ngo').disabled = true;
    try { const src = new URLSearchParams(location.search).get('src') || (qid ? 'quiz' : 'web'); const r = await fetch(API + 'guest', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, lang, src }) }).then((x) => x.json()); if (!r.token) throw new Error(); TOKEN = r.token; try { localStorage.setItem('km_token', TOKEN); } catch (e) {} start(); }
    catch (e) { $('ngo').disabled = false; toast(t('err')); }
  };
  $('ngo').onclick = go; $('nm').onkeydown = (e) => { if (e.key === 'Enter') go(); };
}
boot();
</script>
