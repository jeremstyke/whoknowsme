  if (where === 'copy') { try { navigator.clipboard.writeText(web); toast(t('copied')); } catch (e) {} }
}
const shareBtns = (id, text) => `<button class="btn wa" data-s="wa">💬 WhatsApp</button><button class="btn tg" data-s="tg">✈️ Telegram</button><button class="link" data-s="more">${esc(t('more'))}</button>`;
function bindShare(id, text) {
  app.querySelectorAll('[data-s]').forEach((b) => b.onclick = () => {
    if (b.dataset.s !== 'more') return shareTo(b.dataset.s, id, text);
    const d = document.createElement('div'); d.className = 'sheet';
    d.innerHTML = `<div class="in"><button class="btn" data-o="ms">⚡ Messenger</button><button class="btn" data-o="sms">✉️ SMS</button><button class="btn" data-o="copy">${esc(t('copy'))}</button></div>`;
    document.body.appendChild(d); d.onclick = (e) => { if (e.target === d) d.remove(); };
    d.querySelectorAll('[data-o]').forEach((x) => x.onclick = () => { shareTo(x.dataset.o, id, text); d.remove(); });
  });
}

// ===== home: question of the day + flames, my ranking, new quiz =====
function home() {
  window.scrollTo(0, 0);
  const q = st.quiz;
  if (!q) {
    app.innerHTML = `<div class="heart">💛</div><h1>${esc(t('title'))}</h1><p class="lead">${esc(t('sub'))}</p><button class="btn go" id="new">${esc(t('create'))}</button><div id="dly" style="margin-top:22px"></div>${foot}`;
    $('new').onclick = createFlow; return dailyCard();
  }
  app.innerHTML = `<div id="dly"></div>
    <div class="stk"><h2>${esc(t('myRank'))}</h2>${board(q.board, q.n)}</div>
    <h2 style="margin-top:4px">${esc(t('share'))}</h2>${shareBtns(q.id)}
    <button class="btn go" id="new" style="margin-top:22px">${esc(t('again'))}</button>${foot}`;
  bindShare(q.id, t('shareText'));
  $('new').onclick = createFlow;
  dailyCard();
}
let dailyPre = null;
async function dailyCard() {
  const box = $('dly'); if (!box) return;
  let d = dailyPre; dailyPre = null;
  if (!d) { try { d = await api('daily'); } catch (e) { return; } }
  const draw = () => {
    const qi = d.q, opts = (attr) => `<div class="opts">${[0, 1, 2, 3].map((k) => `<div class="opt" ${attr}="${k}"><b>${Q[qi].e[k]}</b>${esc(oText(qi, k))}</div>`).join('')}</div>`;
    let html = `<h2>${esc(t('daily'))}</h2><p class="q" style="font-size:22px;margin:4px 0 14px;color:#fff">${esc(qText(qi))}</p>`;
    if (d.mine == null) html += opts('data-dm');
    else {
      const fr = d.friends || [], gm = d.guessedMe || [];
      html += `<p style="font-weight:900;margin:0 0 4px">✅ ${Q[qi].e[d.mine]} ${esc(oText(qi, d.mine))}</p>`;
      html += fr.length ? fr.map((f) => `<div class="row"><span class="n">${esc(f.name)}${f.flame ? ` 🔥${f.flame}` : ''}</span>${f.guessed ? `<span>${f.correct ? '✅' : '❌'} ${Q[qi].e[f.answer]}</span>` : `<button class="gbtn" data-gf="${f.id}">${esc(t('guess'))}</button>`}</div>`).join('')
        : `<p class="mute" style="font-size:15px;margin:4px 0 0">${esc(d.friendCount ? t('dWait') : t('noF'))}</p>${d.friendCount ? '' : `<button class="btn sm" id="dinv" style="margin-top:12px">${esc(t('invite'))}</button>`}`;
      if (gm.length) html += `<p style="font-weight:800;margin:12px 0 0;font-size:15px">${esc(t('dGot'))} ${gm.map((g) => `${esc(g.name)} ${g.correct ? '✅' : '❌'}${g.flame > 1 ? '🔥' + g.flame : ''}`).join(' · ')}</p>`;
    }
    box.innerHTML = `<div class="stk daily">${html}</div>`;
    const dinv = $('dinv'); if (dinv) dinv.onclick = () => { if (!st.quiz) return createFlow(); const d2 = document.createElement('div'); d2.className = 'sheet'; d2.innerHTML = `<div class="in"><button class="btn wa" data-o="wa">💬 WhatsApp</button><button class="btn tg" data-o="tg">✈️ Telegram</button><button class="btn" data-o="ms">⚡ Messenger</button><button class="btn" data-o="sms">✉️ SMS</button></div>`; document.body.appendChild(d2); d2.onclick = (e) => { if (e.target === d2) d2.remove(); }; d2.querySelectorAll('[data-o]').forEach((x) => x.onclick = () => { shareTo(x.dataset.o, st.quiz.id, t('shareText')); d2.remove(); }); };
    box.querySelectorAll('[data-dm]').forEach((o) => o.onclick = async () => { haptic('ok'); o.style.opacity = .6; try { d = await api('daily_answer', { answer: Number(o.dataset.dm) }); toast(t('dailyDone').split('!')[0] + ' !'); draw(); } catch (e) { toast(t('err')); } });
    box.querySelectorAll('[data-gf]').forEach((b) => b.onclick = () => {
      haptic(); const f = (d.friends || []).find((x) => String(x.id) === b.dataset.gf);
      box.innerHTML = `<div class="stk daily"><h2>${esc(t('guessWhat', { name: f.name }))}</h2><p class="q" style="font-size:20px;margin:4px 0 14px;color:#fff">${esc(qText(qi))}</p>${opts('data-gg')}</div>`;
      box.querySelectorAll('[data-gg]').forEach((o) => o.onclick = async () => { o.style.opacity = .6; try { d = await api('daily_guess', { target: f.id, guess: Number(o.dataset.gg) }); const nf = d.friends.find((x) => x.id === f.id); haptic(nf && nf.correct ? 'ok' : 'medium'); toast(nf && nf.correct ? '✅' + (nf.flame ? ' 🔥' + nf.flame : '') : '❌'); draw(); } catch (e) { toast(t('err')); } });
    });
  };
  draw();
}

// ===== creating a quiz: 10 questions never asked before to this player =====
function createFlow() {
  haptic();
  const used = new Set(st.used || []);
  let pool = [...Array(Q.length).keys()].filter((x) => !used.has(x));
  if (pool.length < 10) pool = [...Array(Q.length).keys()];
  const ids = pool.sort(() => Math.random() - 0.5).slice(0, 10), answers = [];
  const step = (i) => {
    if (i === 10) {
      app.innerHTML = `<div class="heart">💾</div><p class="lead">${esc(t('saving'))}</p>`;
      return api('create', { questions: ids, answers, theme: 'mix' }).then(async (r) => { haptic('ok'); st = await api('state'); ready(r.id); }).catch(() => { toast(t('err')); home(); });
    }
    const qi = ids[i];
    app.innerHTML = `<div class="top"><button class="x" id="qx">✕</button><span class="mute">${esc(t('aboutMe'))} · ${t('qOf', { i: i + 1, n: 10 })}</span></div>
      <div class="dots">${Array.from({ length: 10 }, (_, k) => `<i class="${k <= i ? 'on' : ''}"></i>`).join('')}</div>
      <p class="q">${esc(qText(qi))}</p><div class="opts">${[0, 1, 2, 3].map((k) => `<div class="opt" data-k="${k}"><b>${Q[qi].e[k]}</b>${esc(oText(qi, k))}</div>`).join('')}</div>`;
    $('qx').onclick = home;
    app.querySelectorAll('.opt').forEach((o) => o.onclick = () => { haptic(); answers.push(Number(o.dataset.k)); step(i + 1); });
  };
  step(0);
}
function ready(id) {
  window.scrollTo(0, 0);
  app.innerHTML = `<div class="heart">🎉</div><h1>${esc(t('ready'))}</h1><p class="lead">${esc(t('readySub'))}</p>${shareBtns(id)}<button class="link" id="hm">← ${esc(t('myRank'))}</button>${foot}`;
  bindShare(id, t('shareText')); $('hm').onclick = home;
}

// ===== a friend's quiz =====
function playFlow(qz) {
  const name = qz.owner, n = nOf(qz), guesses = [];
  app.innerHTML = `<div class="heart">🤔</div><h1>${esc(t('invT', { name }))}</h1><p class="lead">${esc(t('invSub', { n }))}</p><button class="btn go" id="go">${esc(t('start'))}</button>${foot}`;
  const step = (i) => {
    if (i === n) {
      app.innerHTML = `<div class="heart">🎯</div><p class="lead">${esc(t('saving'))}</p>`;
      return api('answer', { id: qz.id, guesses }).then((r) => { haptic('ok'); result(qz, r.score, guesses, r.answers, r.board, r.rank, r.total); }).catch(() => toast(t('err')));
    }
    const qq = qOf(qz, i);
    app.innerHTML = `<div class="top"><button class="x" id="qx">✕</button><span class="mute">${t('qOf', { i: i + 1, n })}</span></div>
      <div class="dots">${Array.from({ length: n }, (_, k) => `<i class="${k <= i ? 'on' : ''}"></i>`).join('')}</div>
      <p class="q"><small>${esc(t('guessWhat', { name }))}</small>${esc(qq.q)}</p><div class="opts">${[0, 1, 2, 3].map((k) => `<div class="opt" data-k="${k}"><b>${qq.e[k]}</b>${esc(qq.o[k])}</div>`).join('')}</div>`;
    $('qx').onclick = home;
    app.querySelectorAll('.opt').forEach((o) => o.onclick = () => { haptic(); guesses.push(Number(o.dataset.k)); step(i + 1); });
  };
  $('go').onclick = () => { haptic('medium'); step(0); };
}
function result(qz, score, guesses, answers, b, rank, total) {
  window.scrollTo(0, 0);
  const name = qz.owner, n = nOf(qz), v = score >= n * 0.8 ? 'vHi' : score >= n * 0.5 ? 'vMid' : 'vLo';
  app.innerHTML = `<div class="stk" style="text-align:center"><div class="score">${score}/${n}</div><h1 style="font-size:26px">${esc(t(v, { name }))}</h1>${rank ? `<span class="badge">${esc(t('rank', { r: rank, t: total }))}</span>` : ''}</div>
    <button class="btn go" id="mk">${esc(t('yours'))}</button>
    <button class="btn" id="ch">${esc(t('challenge'))}</button>
    <div class="stk" style="margin-top:20px"><h2>🏆 ${esc(name)}</h2>${board(b, n)}</div>
    <div class="stk"><h2>${esc(t('answers'))}</h2>${Array.from({ length: n }, (_, i) => { const qq = qOf(qz, i); return `<div class="ans"><span>${guesses[i] === answers[i] ? '✅' : '❌'}</span><div>${esc(qq.q)}<br><b>${qq.e[answers[i]]} ${esc(qq.o[answers[i]])}</b>${guesses[i] !== answers[i] ? ` <em>(${esc(t('you'))} : ${esc(qq.o[guesses[i]])})</em>` : ''}</div></div>`; }).join('')}</div>${foot}`;
  $('mk').onclick = () => { api('ev', { k: 'make_yours' }).catch(() => {}); createFlow(); };
  $('ch').onclick = () => {
    const d = document.createElement('div'); d.className = 'sheet'; const text = t('challengeText', { s: score + '/' + n, name });
    d.innerHTML = `<div class="in"><button class="btn wa" data-o="wa">💬 WhatsApp</button><button class="btn tg" data-o="tg">✈️ Telegram</button><button class="btn" data-o="ms">⚡ Messenger</button><button class="btn" data-o="sms">✉️ SMS</button></div>`;
    document.body.appendChild(d); d.onclick = (e) => { if (e.target === d) d.remove(); };
    d.querySelectorAll('[data-o]').forEach((x) => x.onclick = () => { shareTo(x.dataset.o, qz.id, text); d.remove(); });
  };
}

// ===== start: Telegram players are known; web visitors give their first name once =====
async function start() {
  try { const [s1, d1] = await Promise.all([api('state'), api('daily').catch(() => null)]); st = s1; dailyPre = d1; } catch (e) { if (!IN_TG) { TOKEN = ''; try { localStorage.removeItem('km_token'); } catch (er) {} return boot(); } app.innerHTML = `<div class="heart">😕</div><p class="lead">${esc(t('err'))}</p>`; return; }
  if (st.me && st.me.lang && S[st.me.lang]) { lang = st.me.lang; document.documentElement.lang = lang; }
  const sp = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || '';
  const qid = (new URLSearchParams(location.search).get('q') || (sp.startsWith('q_') ? sp.slice(2) : '')).replace(/[^a-z0-9]/g, '');
  if (qid) {
    try {
      const qz = await api('quiz', { id: qid });
      if (qz.mine) { toast(t('mine')); return home(); }
      if (qz.done) return result(qz, qz.done.score, qz.done.guesses, qz.done.answers, qz.board, qz.board.findIndex((b) => b.score === qz.done.score) + 1, qz.board.length);
      return playFlow(qz);
    } catch (e) { toast(t('noquiz')); }
  }
  home();
}
function boot() {
  if (IN_TG || TOKEN) return start();
  const qid = new URLSearchParams(location.search).get('q');
  app.innerHTML = `<div class="heart">${qid ? '👀' : '💛'}</div><h1>${esc(qid ? t('invT0') : t('title'))}</h1><p class="lead">${esc(qid ? t('invSub0') : t('sub'))}</p>
    <input class="inp" id="nm" maxlength="30" placeholder="${esc(t('yourName'))}" autocomplete="given-name"><button class="btn go" id="ngo">${esc(t('goOn'))}</button>
    <a class="link" href="https://t.me/${BOTU}">${esc(t('playTg'))}</a>${foot}`;
  const go = async () => {
    const name = $('nm').value.trim(); if (name.length < 2) return toast(t('nameNeed'));
    $('ngo').disabled = true;
    try { const src = new URLSearchParams(location.search).get('src') || (qid ? 'quiz' : 'web'); const r = await fetch(API + 'guest', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, lang, src }) }).then((x) => x.json()); if (!r.token) throw new Error(); TOKEN = r.token; try { localStorage.setItem('km_token', TOKEN); } catch (e) {} start(); }
    catch (e) { $('ngo').disabled = false; toast(t('err')); }
  };
  $('ngo').onclick = go; $('nm').onkeydown = (e) => { if (e.key === 'Enter') go(); };
}
boot();
</script>
