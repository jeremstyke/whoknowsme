<style>

.lead{text-align:center;font-weight:800;margin:0 0 4px}
.mute{color:var(--mute);font-weight:800}
.heart{width:118px;height:118px;margin:6px auto 14px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);display:flex;align-items:center;justify-content:center;font-size:66px;transform:rotate(-6deg)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:3px solid var(--ink);border-radius:20px;padding:16px;font:900 19px Nunito,sans-serif;cursor:pointer;margin:12px 0 0;color:var(--ink);background:var(--paper);box-shadow:5px 5px 0 var(--ink);text-decoration:none;transition:transform .08s}
.btn:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
.btn.go{background:var(--coral);color:#fff}.btn.wa{background:#25d366;color:#fff}.btn.tg{background:#2aabee;color:#fff}.btn.ink{background:var(--ink);color:var(--sun)}
.btn.sm{padding:11px;font-size:16px;border-radius:16px;box-shadow:4px 4px 0 var(--ink)}
.link{display:block;text-align:center;margin:16px 0 0;font-weight:900;color:var(--ink);text-decoration:underline;cursor:pointer;background:none;border:0;font-size:16px;width:100%}
.dots{display:flex;gap:6px;justify-content:center;margin:0 0 14px}.dots i{width:22px;height:8px;border-radius:9px;background:rgba(29,18,56,.18)}.dots i.on{background:var(--ink)}
.q{font:700 26px/1.2 Fredoka,sans-serif;text-align:center;margin:4px 0 18px}
.q small{display:block;font:800 15px Nunito,sans-serif;color:var(--mute);margin-bottom:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{border:3px solid var(--ink);border-radius:22px;padding:16px 8px;text-align:center;cursor:pointer;color:#fff;font:900 16px Nunito,sans-serif;min-height:124px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:4px 4px 0 var(--ink);text-shadow:0 1px 0 rgba(0,0,0,.15)}
.opt b{font-size:44px;line-height:1;text-shadow:none}.opt:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}

.top{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.x{width:44px;height:44px;border-radius:14px;border:3px solid var(--ink);background:var(--paper);box-shadow:3px 3px 0 var(--ink);font:900 18px Nunito,sans-serif;cursor:pointer;flex:none}
.top .mute{flex:1;text-align:right}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:2px dashed rgba(29,18,56,.15)}.row:last-child{border-bottom:0}
.row .n{flex:1;font-weight:900}.row .s{font:700 19px Fredoka,sans-serif}
.score{font:700 76px/1 Fredoka,sans-serif;text-align:center;margin:4px 0}
.badge{display:inline-block;background:var(--ink);color:var(--sun);border-radius:999px;padding:4px 12px;font-weight:900;font-size:14px}
.daily{background:var(--violet);color:#fff}.daily .mute{color:rgba(255,255,255,.85)}.daily h2{color:#fff}
.daily .opt{min-height:96px;font-size:15px}.daily .row{border-color:rgba(255,255,255,.25)}

.fl{flex:none;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:18px;padding:8px 12px;text-align:center;min-width:86px;box-shadow:3px 3px 0 var(--ink)}
.fl b{display:block;font:700 22px Fredoka,sans-serif}.fl span{font-weight:900;font-size:13px}.fl.dim{opacity:.6}
.gbtn{border:2px solid #fff;background:rgba(255,255,255,.15);color:#fff;border-radius:12px;padding:7px 12px;font:900 14px Nunito,sans-serif;cursor:pointer}
.inp{width:100%;background:var(--paper);border:3px solid var(--ink);border-radius:18px;color:var(--ink);padding:15px;font:900 18px Nunito,sans-serif;margin:8px 0 0;box-shadow:4px 4px 0 var(--ink)}
.inp:focus{outline:none}
.ans{display:flex;gap:10px;padding:9px 0;border-bottom:2px dashed rgba(29,18,56,.15);font-size:15px;font-weight:700}.ans:last-child{border-bottom:0}.ans em{font-style:normal;color:var(--mute)}
.sheet{position:fixed;inset:0;background:rgba(29,18,56,.5);display:flex;align-items:flex-end;z-index:9}
.sheet .in{width:100%;max-width:480px;margin:0 auto;background:var(--sun);border:3px solid var(--ink);border-bottom:0;border-radius:28px 28px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom,0))}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:var(--sun);padding:12px 18px;border-radius:14px;font-weight:900;z-index:20;white-space:nowrap}
.wyr{display:grid;grid-template-columns:1fr 1fr;gap:12px;position:relative}

.wy b{font-size:46px;line-height:1}.wy:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}

.ortag{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:4px 10px;font:900 14px Nunito,sans-serif;z-index:2;color:var(--ink)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pk{background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:14px 8px;text-align:center;font:900 16px Nunito,sans-serif;cursor:pointer;box-shadow:3px 3px 0 var(--ink);color:var(--ink)}
.pk:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.cg{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:2px dashed rgba(29,18,56,.15);font-weight:800}.cg:last-child{border-bottom:0}.cg .tx{flex:1}

.streak{display:inline-block;background:var(--ink);color:var(--sun);border-radius:999px;padding:6px 14px;font:900 16px Nunito,sans-serif}

.strip{display:flex;gap:12px;overflow-x:auto;padding:6px 2px 10px;margin:0 -2px}

.bar2{height:14px;border-radius:9px;background:rgba(255,255,255,.25);overflow:hidden;margin:6px 0}.bar2 i{display:block;height:100%;background:var(--sun)}
.foot{margin-top:22px;text-align:center;font-weight:800;font-size:13px}.foot a{color:var(--ink)}
@media (prefers-reduced-motion:reduce){.btn,.opt{transition:none}}
</style>

  const pick = (camera) => {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; if (camera) inp.setAttribute('capture', 'user');
    inp.onchange = () => {

        const k = Math.min(1, 1080 / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        toast(t('phSending')); await call('photo', { img: c.toDataURL('image/jpeg', 0.8) });

  if (IN_TG || TOKEN) return start();
  const qid = new URLSearchParams(location.search).get('q');
  app.innerHTML = `${installBanner()}<div class="heart">${qid ? '👀' : '💛'}</div><h1>${esc(qid ? t('invT0') : t('title'))}</h1><p class="lead">${esc(qid ? t('invSub0') : t('sub'))}</p>
    <input class="inp" id="nm" maxlength="30" placeholder="${esc(t('yourName'))}" autocomplete="given-name"><button class="btn go" id="ngo">${esc(t('goOn'))}</button>
    <a class="link" href="https://t.me/${BOTU}">${esc(t('playTg'))}</a>${foot}`;
  const go = async () => {
    const name = $('nm').value.trim(); if (name.length < 2) return toast(t('nameNeed'));
    $('ngo').disabled = true;
    try { const src = new URLSearchParams(location.search).get('src') || (qid ? 'quiz' : 'web'); const r = await fetch(API + 'guest', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, lang, src }) }).then((x) => x.json()); if (!r.token) throw new Error(); TOKEN = r.token; try { localStorage.setItem('km_token', TOKEN); } catch (e) {} start(); }
    catch (e) { $('ngo').disabled = false; toast(t('err')); }
  };
  $('ngo').onclick = go; $('nm').onkeydown = (e) => { if (e.key === 'Enter') go(); };
}
boot();
</script>
</body>
</html>
