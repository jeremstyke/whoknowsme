<style>
:root{--night:#1a1033;--card:#271a4a;--line:rgba(255,255,255,.12);--ink:#fff8ec;--mute:#bfb3dd;--sun:#ffd84d;--coral:#ff6b8b;--mint:#5ef2c2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--night);color:var(--ink);font:17px/1.45 Nunito,ui-rounded,system-ui,sans-serif}
body{background:radial-gradient(700px 420px at 50% -80px,#4b2a8a 0%,transparent 70%),var(--night);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.w{max-width:520px;margin:0 auto;padding:22px 16px 40px}
h1{font:700 30px/1.15 Fredoka,ui-rounded,sans-serif;margin:8px 0 10px;text-align:center}
h2{font:700 22px/1.2 Fredoka,ui-rounded,sans-serif;margin:0 0 14px;text-align:center}
.big{font-size:74px;text-align:center;line-height:1;margin-top:10px}
.sub{color:var(--mute);text-align:center;margin:0 0 18px}
.steps{background:var(--card);border-radius:22px;padding:16px 18px;margin:0 0 18px}
.steps div{display:flex;gap:12px;align-items:center;margin:8px 0;font-weight:800}
.steps span{flex:none;width:34px;height:34px;border-radius:50%;background:var(--sun);color:var(--night);display:flex;align-items:center;justify-content:center;font:700 17px Fredoka,sans-serif}
.btn{display:block;width:100%;border:0;border-radius:18px;padding:17px;font:800 18px Nunito,sans-serif;cursor:pointer;margin:10px 0 0;color:var(--night);background:var(--sun);box-shadow:0 6px 0 #c9a320}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #c9a320}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.coral{background:var(--coral);color:#fff;box-shadow:0 6px 0 #c7405e}
.prog{height:10px;background:var(--card);border-radius:99px;overflow:hidden;margin:4px 0 18px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--coral));border-radius:99px;transition:width .3s}
.qn{color:var(--mute);font-weight:800;text-align:center;margin:0 0 6px}
.q{font:700 24px/1.25 Fredoka,sans-serif;text-align:center;margin:0 0 20px;min-height:60px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px 10px;text-align:center;cursor:pointer;color:var(--ink);font:800 16px Nunito,sans-serif;min-height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.opt b{font-size:40px;line-height:1}
.opt:active{transform:scale(.97)}
.opt.ok{border-color:var(--mint);background:rgba(94,242,194,.15)}
.opt.ko{border-color:var(--coral);background:rgba(255,107,139,.15)}
.card{background:var(--card);border-radius:22px;padding:16px 18px;margin:16px 0}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .n{flex:1;font-weight:800}.row .s{font:700 18px Fredoka,sans-serif;color:var(--sun)}
.score{width:170px;height:170px;border-radius:50%;margin:14px auto 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:conic-gradient(var(--sun) calc(var(--p)*1%),var(--card) 0);position:relative}
.score::before{content:'';position:absolute;inset:14px;border-radius:50%;background:var(--night)}
.score b{position:relative;font:700 48px Fredoka,sans-serif}.score span{position:relative;color:var(--mute);font-weight:800}
.ans{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.ans:last-child{border-bottom:0}.ans em{font-style:normal;color:var(--mute)}
.muted{color:var(--mute);text-align:center}.small{font-size:13px}

.themes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 4px}
.th{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px 8px;text-align:center;cursor:pointer;font:800 15px Nunito,sans-serif;color:var(--ink)}

.ed{background:var(--card);border-radius:20px;padding:14px;margin:12px 0}
.ed .orow{display:flex;gap:8px;align-items:center}.ed .orow .inp{margin:4px 0}
.ok{flex:none;width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--mute);font-size:20px;cursor:pointer}
.ok.on{border-color:var(--mint);background:rgba(94,242,194,.18);color:var(--mint)}
.shares{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.sh{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:14px 8px;font:800 15px Nunito,sans-serif;color:#fff;cursor:pointer;text-decoration:none}
.sh.wa{background:#25D366}.sh.ms{background:#0084FF}.sh.sms{background:#8e7cc3}.sh.tg{background:#229ED9}.sh.cp{background:transparent;border:2px solid var(--line);grid-column:1/3}
.sheet{position:fixed;inset:0;background:rgba(10,5,25,.7);display:flex;align-items:flex-end;z-index:8}
.sheet .in{background:var(--night);width:100%;max-width:520px;margin:0 auto;border-radius:26px 26px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom,0))}
.daily{background:linear-gradient(135deg,#3b2470,#271a4a);border:2px solid rgba(255,216,77,.35);border-radius:22px;padding:16px 18px;margin:0 0 16px}
.daily .tag{color:var(--sun);font-weight:800;font-size:14px}.daily .opts .opt{min-height:96px}
.vip{background:linear-gradient(135deg,#ffd84d,#ff9f43);color:var(--night);border-radius:22px;padding:18px;margin:18px 0;text-align:center}
.vip b{font:700 21px Fredoka,sans-serif;display:block}.vip .btn{background:var(--night);color:var(--sun);box-shadow:none}
.hero{text-align:center;padding:10px 0 4px}.hero .big{font-size:90px}
.foot{margin-top:26px;text-align:center;color:var(--mute);font-size:12px}.foot a{color:var(--mute)}

function openOut(u) { try { if (IN_TG && /^https:/.test(u)) { /t\.me\//.test(u) ? tg.openTelegramLink(u) : tg.openLink(u); return; } } catch (e) {} location.href = u; }
function shareSheet(id, text) {
  haptic('medium'); api('ev', { k: 'share_open' }).catch(() => {});
  const web = SITE + '?q=' + id, full = text + ' ' + web;
  const d = document.createElement('div'); d.className = 'sheet';
  d.innerHTML = `<div class="in"><h2>${esc(t('shareOn'))}</h2><div class="shares">
    <a class="sh wa" data-u="https://wa.me/?text=${encodeURIComponent(full)}" data-k="whatsapp">🟢 ${esc(t('wa'))}</a>
    <a class="sh ms" data-u="fb-messenger://share/?link=${encodeURIComponent(web)}" data-k="messenger">💬 ${esc(t('ms'))}</a>
    <a class="sh tg" data-u="https://t.me/share/url?url=${encodeURIComponent(quizLink(id))}&text=${encodeURIComponent(text)}" data-k="telegram">✈️ ${esc(t('tgS'))}</a>
    <a class="sh sms" data-u="sms:?&body=${encodeURIComponent(full)}" data-k="sms">✉️ ${esc(t('sms'))}</a>
    <button class="sh cp" id="cpl">${esc(t('copyLink'))}</button></div></div>`;
  document.body.appendChild(d);
  d.onclick = (e) => { if (e.target === d) d.remove(); };
  d.querySelectorAll('[data-u]').forEach((a) => a.onclick = () => { api('ev', { k: 'share_' + a.dataset.k }).catch(() => {}); openOut(a.dataset.u); });
  d.querySelector('#cpl').onclick = () => { try { navigator.clipboard.writeText(web); toast(t('copied')); } catch (e) {} api('ev', { k: 'share_copy' }).catch(() => {}); };
}
function share(id) { return shareSheet(id, t('shareText')); }
function share_old(id) {
  haptic('medium'); api('ev', { k: 'share' }).catch(() => {});
  const u = `https://t.me/share/url?url=${encodeURIComponent(quizLink(id))}&text=${encodeURIComponent(t('shareText'))}`;
  try { tg.openTelegramLink(u); } catch (e) { location.href = u; }
}

// home: my quizzes (one per theme) with their ranking, or the theme choice for a first quiz
function themePicker() {
  const P = st.prices || { custom: 50 };
  return `<div class="themes">${THEMES.map((x) => `<div class="th" data-th="${x.id}"><b>${x.e}</b>${esc(t('theme_' + x.id))}</div>`).join('')}<div class="th paid" data-th="custom" style="grid-column:1/3"><b>✍️</b>${esc(t('customBtn').replace(/^\S+\s/, ''))}<small>${esc(t('stars', { p: P.custom }))}</small></div></div>`;
}
function bindThemes() { app.querySelectorAll('[data-th]').forEach((x) => x.onclick = () => { haptic(); x.dataset.th === 'custom' ? editor() : createFlow(x.dataset.th); }); }
function home() {
  const qs = st.quizzes || [];
  if (!qs.length) {
    app.innerHTML = `<div class="big">💛</div><h1>${esc(t('title'))}</h1>
      <div class="steps"><div><span>1</span>${esc(t('s1'))}</div><div><span>2</span>${esc(t('s2'))}</div><div><span>3</span>${esc(t('s3'))}</div></div>
      <h2>${esc(t('pickTheme'))}</h2>${themePicker()}${foot}`;
    return bindThemes();
  }
  const P = st.prices || { details: 25, vip: 250 };
  app.innerHTML = `<div id="dailyBox"></div><h1>${esc(t('myQuizzes'))}</h1>` + qs.map((q) => { const th = themeOf(q.theme); return `<div class="qz"><div class="hd"><span style="font-size:28px">${th.e}</span><b>${esc(t('theme_' + th.id))}</b><span>${esc(t('answersN', { n: q.plays || 0 }))}</span></div>
      ${q.board.length ? q.board.slice(0, 3).map((x, i) => `<div class="row"><span>${medal(i)}</span><span class="n">${esc(x.name)}</span><span class="s">${x.score}/${q.n}</span></div>`).join('') : `<p class="muted small" style="margin:6px 0">${esc(t('nobody'))}</p>`}
      <div class="btns"><button class="btn" data-sh="${q.id}">${esc(t('share'))}</button><button class="btn alt" data-rk="${q.id}">${esc(t('rankingBtn'))}</button></div>
      ${q.board.length ? `<button class="btn alt" data-dt="${q.id}" style="margin-top:8px;padding:12px;font-size:15px">${esc(q.details ? t('detailsOpen') : t('detailsBtn', { p: P.details }))}</button>` : ''}</div>`; }).join('')
    + `<h2 style="margin-top:22px">${esc(t('newQuiz'))}</h2>${themePicker()}${vipCard()}${foot}`;
  bindThemes(); bindVip(); dailyCard();
  app.querySelectorAll('[data-sh]').forEach((b) => b.onclick = () => share(b.dataset.sh));
  app.querySelectorAll('[data-rk]').forEach((b) => b.onclick = () => { haptic(); const q = qs.find((x) => x.id === b.dataset.rk); app.innerHTML = `<button class="btn alt" id="bk" style="margin:0 0 6px">${esc(t('back'))}</button><div class="card"><h2>${esc(t('ranking'))}</h2>${boardHtml(q.board, q.n)}</div><button class="btn" id="sh2">${esc(t('share'))}</button>`; $('bk').onclick = home; $('sh2').onclick = () => share(q.id); });
  app.querySelectorAll('[data-dt]').forEach((b) => b.onclick = () => { const q = qs.find((x) => x.id === b.dataset.dt); q.details ? details(q.id) : buy('details', { id: q.id }, () => details(q.id)); });
}

// Premium for life: everything unlocked
function vipCard() {
  if (st.me && st.me.vip) return `<p class="muted" style="margin-top:18px">${esc(t('vipOn'))} ✨</p>`;
  return `<div class="vip"><b>${esc(t('vipT'))}</b><p style="margin:6px 0 10px;font-weight:800">${esc(t('vipD'))}</p><button class="btn" id="vipb">${esc(t('vipBtn', { p: (st.prices || {}).vip || 250 }))}</button></div>`;
}
function bindVip() { const b = $('vipb'); if (b) b.onclick = () => buy('vip', {}, () => home()); }

// the question of the day: my answer, then guess my friends' answers
async function dailyCard() {
  const box = $('dailyBox'); if (!box) return;
  let d; try { d = await api('daily'); } catch (e) { return; }
  const draw = () => {
    const qi = d.q, opts = (sel, attr) => `<div class="opts">${[0, 1, 2, 3].map((k) => `<div class="opt ${sel === k ? 'ok' : ''}" ${attr}="${k}"><b>${Q[qi].e[k]}</b>${esc(oText(qi, k))}</div>`).join('')}</div>`;
    const head = `<div class="tag">${esc(t('dailyT'))}${d.streak ? ' · ' + esc(t('streak', { n: d.streak })) : ''}${d.points ? ' · ' + esc(t('points', { n: d.points })) : ''}</div><p class="q" style="min-height:0;margin:8px 0 12px;font-size:21px">${esc(qText(qi))}</p>`;
    if (d.mine == null) { box.innerHTML = `<div class="daily">${head}<p class="qn">${esc(t('dailyMine'))}</p>${opts(null, 'data-dm')}</div>`; box.querySelectorAll('[data-dm]').forEach((o) => o.onclick = async () => { haptic('ok'); try { d = await api('daily_answer', { answer: Number(o.dataset.dm) }); toast(t('dailyDone')); draw(); } catch (e) { toast(t('err')); } }); return; }
    const fr = d.friends || [];
    box.innerHTML = `<div class="daily">${head}<p class="qn" style="text-align:left">${esc(t('dailyDone'))} ${Q[qi].e[d.mine]} ${esc(oText(qi, d.mine))}</p>
      ${fr.length ? `<p class="qn" style="text-align:left;margin-top:10px">${esc(t('guessFriends'))}</p>` + fr.map((f) => `<div class="row"><span class="n">${esc(f.name)}</span>${f.guessed ? `<span>${f.correct ? '✅' : '❌'} ${Q[qi].e[f.answer]}</span>` : `<button class="btn alt" data-gf="${f.id}" style="margin:0;padding:8px 14px;width:auto;font-size:14px">${esc(t('guessBtn'))}</button>`}</div>`).join('')
        : `<p class="muted small">${esc(d.friendCount ? t('waitFriends') : t('noFriendsYet'))}</p>`}</div>`;
    box.querySelectorAll('[data-gf]').forEach((b) => b.onclick = () => {
      haptic(); const f = fr.find((x) => String(x.id) === b.dataset.gf);
      box.innerHTML = `<div class="daily">${head}<p class="qn">${esc(t('guess', { name: f.name }))}</p>${opts(null, 'data-gg')}</div>`;
      box.querySelectorAll('[data-gg]').forEach((o) => o.onclick = async () => { try { d = await api('daily_guess', { target: f.id, guess: Number(o.dataset.gg) }); const nf = d.friends.find((x) => x.id === f.id); haptic(nf && nf.correct ? 'ok' : 'medium'); toast(nf && nf.correct ? '✅ +1' : '❌'); draw(); } catch (e) { toast(t('err')); } });
    });
  };
  draw();
}

// paying in Stars (the owner of the game tests for free); after the payment the state is reloaded
async function buy(kind, extra, after) {
  haptic('medium');
  if (!IN_TG) return toast(t('tgPay'));
  let r; try { r = await api('invoice', { kind, ...extra }); } catch (e) { return toast(e.code === 'links' ? t('links') : t('err')); }
  const done = async () => { toast(t('paidOk')); for (let k = 0; k < 8; k++) { await new Promise((ok) => setTimeout(ok, 1200)); try { st = await api('state'); } catch (e) {} if (kind === 'vip' ? st.me.vip : kind !== 'custom' || (st.quizzes || []).some((q) => q.custom && q.id !== (extra.prevId || ''))) break; } after ? after() : home(); };
  if (r.done) return done();
  try { tg.openInvoice(r.link, (status) => { if (status === 'paid') done(); }); } catch (e) { toast(t('err')); }
}
// each friend's answers (unlocked)
async function details(id) {
  let d; try { d = await api('details', { id }); } catch (e) { return toast(t('err')); }
  const qz = { custom: d.custom, questions: d.questions, n: d.n };
  app.innerHTML = `<button class="btn alt" id="bk" style="margin:0 0 6px">${esc(t('back'))}</button><h1>${esc(t('detT'))}</h1>` + (d.people.length ? d.people.map((p) => `<div class="card"><div class="row"><span class="n">${esc(p.name)}</span><span class="s">${p.score}/${d.n}</span></div>${Array.from({ length: d.n }, (_, i) => { const qq = qOf(qz, i); return `<div class="ans"><span>${p.guesses[i] === d.answers[i] ? '✅' : '❌'}</span><div><b>${esc(qq.q)}</b><br>${qq.e[p.guesses[i]] || ''} ${esc(qq.o[p.guesses[i]] || '')}</div></div>`; }).join('')}</div>`).join('') : `<p class="muted">${esc(t('nobody'))}</p>`);
  $('bk').onclick = async () => { try { st = await api('state'); } catch (e) {} home(); };
}

// the creator writes his own questions (5 to 10), then pays to publish
function editor() {
  const P = st.prices || { custom: 50 };
  let rows = []; try { rows = JSON.parse(localStorage.getItem('km_draft') || '[]'); } catch (e) {}
  if (!rows.length) rows = Array.from({ length: 5 }, () => ({ q: '', o: ['', '', '', ''], a: -1 }));
  const save = () => { try { localStorage.setItem('km_draft', JSON.stringify(rows)); } catch (e) {} };
  const draw = () => {
    app.innerHTML = `<button class="btn alt" id="bk" style="margin:0 0 6px">${esc(t('back'))}</button><h1>${esc(t('edT'))}</h1><p class="sub">${esc(t('edSub'))}</p>`
      + rows.map((r, i) => `<div class="ed"><p class="qn" style="text-align:left">${esc(t('edQ', { i: i + 1 }))}</p><input class="inp" data-q="${i}" maxlength="120" placeholder="${esc(t('edQPh'))}" value="${esc(r.q)}">`
        + [0, 1, 2, 3].map((k) => `<div class="orow"><input class="inp" data-o="${i}:${k}" maxlength="40" placeholder="${esc(t('edOPh', { k: k + 1 }))}" value="${esc(r.o[k])}"><button class="ok ${r.a === k ? 'on' : ''}" data-a="${i}:${k}">${r.a === k ? '✅' : '⚪'}</button></div>`).join('') + `</div>`).join('')
      + (rows.length < 10 ? `<button class="btn alt" id="add">${esc(t('edAdd'))}</button>` : '') + `<button class="btn" id="pub">${esc(t('edPublish', { p: P.custom }))}</button>${foot}`;
    $('bk').onclick = home;
    app.querySelectorAll('[data-q]').forEach((x) => x.oninput = () => { rows[x.dataset.q].q = x.value; save(); });
    app.querySelectorAll('[data-o]').forEach((x) => x.oninput = () => { const [i, k] = x.dataset.o.split(':').map(Number); rows[i].o[k] = x.value; save(); });
    app.querySelectorAll('[data-a]').forEach((x) => x.onclick = () => { haptic(); const [i, k] = x.dataset.a.split(':').map(Number); rows[i].a = k; save(); app.querySelectorAll(`[data-a^="${i}:"]`).forEach((y) => { y.classList.toggle('on', y === x); y.textContent = y === x ? '✅' : '⚪'; }); });
    const add = $('add'); if (add) add.onclick = () => { rows.push({ q: '', o: ['', '', '', ''], a: -1 }); save(); draw(); window.scrollTo(0, document.body.scrollHeight); };
    $('pub').onclick = () => {
      const full = rows.filter((r) => r.q.trim().length >= 3 && r.o.every((o) => o.trim()) && r.a >= 0);
      if (full.length < 5) return toast(t('edNeed'));
      const prevId = ((st.quizzes || []).find((q) => q.custom) || {}).id;
      buy('custom', { questions: full.map((r) => ({ q: r.q.trim(), o: r.o.map((o) => o.trim()), a: r.a })), prevId }, () => { try { localStorage.removeItem('km_draft'); } catch (e) {} home(); const c = (st.quizzes || []).find((q) => q.custom); if (c) share(c.id); });
    };
  };
  draw();
}

// creating a quiz of a theme: 10 questions picked at random among the theme's ones
function createFlow(themeId) {
  haptic();
  const th = themeOf(themeId || 'classic');
  const ids = [...Array(th.to - th.from).keys()].map((x) => x + th.from).sort(() => Math.random() - 0.5).slice(0, 10), answers = [];
  const step = (i) => {
    if (i === 10) {
      app.innerHTML = `<div class="big">💾</div><p class="sub">${esc(t('saving'))}</p>`;
      return api('create', { questions: ids, answers, theme: th.id }).then(async (r) => { haptic('ok'); st = await api('state'); home(); share(r.id); }).catch(() => { toast(t('err')); home(); });
    }
    const qi = ids[i];
    app.innerHTML = `<p class="qn">${th.e} ${esc(t('theme_' + th.id))} · ${esc(t('qOf', { i: i + 1 }))}</p><div class="prog"><i style="width:${i * 10}%"></i></div>
      <p class="q">${esc(qText(qi))}</p><div class="opts">${[0, 1, 2, 3].map((k) => `<div class="opt" data-k="${k}"><b>${Q[qi].e[k]}</b>${esc(oText(qi, k))}</div>`).join('')}</div>`;
    app.querySelectorAll('.opt').forEach((o) => o.onclick = () => { haptic(); answers.push(Number(o.dataset.k)); step(i + 1); });
  };
  step(0);
}

// a friend's quiz: guess the answers, then the score, the place in the ranking and the right answers
function playFlow(qz) {
  const name = qz.owner, n = nOf(qz);
  app.innerHTML = `<div class="big">🤔</div><h1>${esc(t('howWell', { name }))}</h1><p class="sub">${esc(t('guessSub', { name }).replace('10', n))}</p><button class="btn" id="go">${esc(t('start'))}</button>${foot}`;
  const guesses = [];
  const step = (i) => {
    if (i === n) {
      app.innerHTML = `<div class="big">🎯</div><p class="sub">${esc(t('saving'))}</p>`;
      return api('answer', { id: qz.id, guesses }).then((r) => { haptic('ok'); result(qz, r.score, guesses, r.answers, r.board, r.rank, r.total); }).catch(() => { toast(t('err')); });
    }
    const qq = qOf(qz, i);
    app.innerHTML = `<p class="qn">${esc(t('qOf', { i: i + 1 }).replace('10', n))}</p><div class="prog"><i style="width:${(i / n) * 100}%"></i></div>
      <p class="q">${esc(t('guess', { name }))}<br><span style="font-size:20px;color:var(--sun)">${esc(qq.q)}</span></p><div class="opts">${[0, 1, 2, 3].map((k) => `<div class="opt" data-k="${k}"><b>${qq.e[k]}</b>${esc(qq.o[k])}</div>`).join('')}</div>`;
    app.querySelectorAll('.opt').forEach((o) => o.onclick = () => { haptic(); guesses.push(Number(o.dataset.k)); step(i + 1); });
  };
  $('go').onclick = () => { haptic('medium'); step(0); };
}
function result(qz, score, guesses, answers, board, rank, total) {
  const name = qz.owner, n = nOf(qz), v = score >= n * 0.8 ? 'vHi' : score >= n * 0.5 ? 'vMid' : 'vLo';
  app.innerHTML = `<p class="qn">${esc(t('result'))}</p><div class="score" style="--p:${(score / n) * 100}"><b>${score}/${n}</b></div>
    <h2>${esc(t(v, { name }))}</h2>${rank ? `<p class="sub">${esc(t('rankYou', { r: rank, t: total }))}</p>` : ''}
    <button class="btn coral" id="mk">${esc(t('makeYours'))}</button>
    <button class="btn alt" id="ch">${esc(t('challenge'))}</button>
    <div class="card"><h2>${esc(t('rankOf', { name }))}</h2>${boardHtml(board, n)}</div>
    <div class="card">${Array.from({ length: n }, (_, i) => { const qq = qOf(qz, i); return `<div class="ans"><span>${guesses[i] === answers[i] ? '✅' : '❌'}</span><div><b>${esc(qq.q)}</b><br>${qq.e[answers[i]]} ${esc(qq.o[answers[i]])}${guesses[i] !== answers[i] ? ` <em>(${esc(t('yourGuess'))} : ${esc(qq.o[guesses[i]])})</em>` : ''}</div></div>`; }).join('')}</div>${foot}`;
  $('mk').onclick = () => { api('ev', { k: 'make_yours' }).catch(() => {}); if ((st.quizzes || []).length) home(); else { app.innerHTML = `<h1>${esc(t('pickTheme'))}</h1>${themePicker()}${foot}`; bindThemes(); } };
  $('ch').onclick = () => { api('ev', { k: 'challenge' }).catch(() => {}); shareSheet(qz.id, t('challengeText', { s: score + '/' + n, name })); };
}

function nameView(intro, then) {
  app.innerHTML = `${intro}<input class="inp" id="nm" maxlength="30" placeholder="${esc(t('yourName'))}" autocomplete="given-name"><button class="btn" id="ngo">${esc(t('nameGo'))}</button>
    <a class="btn alt" href="https://t.me/${BOTU}" style="display:block;text-align:center;text-decoration:none">✈️ ${esc(t('playTg'))}</a>${foot}`;
  const go = async () => {
    const name = $('nm').value.trim(); if (name.length < 2) return toast(t('nameNeed'));
    $('ngo').disabled = true;
    try { const src = (new URLSearchParams(location.search).get('src') || (new URLSearchParams(location.search).get('q') ? 'quiz' : 'web')); const r = await fetch(API + 'guest', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, lang, src }) }).then((x) => x.json()); if (!r.token) throw new Error(); TOKEN = r.token; try { localStorage.setItem('km_token', TOKEN); } catch (e) {} then(); }
    catch (e) { $('ngo').disabled = false; toast(t('err')); }
  };
  $('ngo').onclick = go; $('nm').onkeydown = (e) => { if (e.key === 'Enter') go(); };
}
async function start() {
  try { st = await api('state'); } catch (e) { if (!IN_TG) { TOKEN = ''; try { localStorage.removeItem('km_token'); } catch (er) {} return boot(); } app.innerHTML = `<div class="big">😕</div><p class="sub">${esc(t('err'))}</p>`; return; }
  if (st.me && st.me.lang && S[st.me.lang]) { lang = st.me.lang; document.documentElement.lang = lang; }
  const sp = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || '';
  const qid = (new URLSearchParams(location.search).get('q') || (sp.startsWith('q_') ? sp.slice(2) : '')).replace(/[^a-z0-9]/g, '');
  if (qid) {
    try {
      const qz = await api('quiz', { id: qid });
      if (qz.mine) { toast(t('mine')); return home(); }
      if (qz.done) return result(qz, qz.done.score, qz.done.guesses, qz.done.answers, qz.board, qz.board.findIndex((b) => b.score === qz.done.score) + 1, qz.board.length);
      return playFlow(qz);
    } catch (e) { toast(t('noquiz')); }
  }
  home();
}
function boot() {
  if (IN_TG || TOKEN) return start();
  const qid = (new URLSearchParams(location.search).get('q') || '').replace(/[^a-z0-9]/g, '');
  const intro = qid
    ? `<div class="hero"><div class="big">🤔</div><h1>${esc(t('friendInv'))}</h1><p class="sub">${esc(t('friendInvSub'))}</p></div>`
    : `<div class="hero"><div class="big">💛</div><h1>${esc(t('title'))}</h1><p class="sub">${esc(t('webSub'))}</p></div>
       <div class="steps"><div><span>1</span>${esc(t('s1'))}</div><div><span>2</span>${esc(t('s2'))}</div><div><span>3</span>${esc(t('s3'))}</div></div>`;
  nameView(intro, start);
}
boot();
</script>
