async function tgWait(code, url) {
  app.innerHTML = `<div class="heart">✈️</div><h1>${esc(t('tgWaitT'))}</h1><p class="lead">${esc(t('tgWaitS'))}</p><a class="btn tg" href="${url}">${esc(t('tgOpen2'))}</a><button class="link" id="tgc">${esc(t('cancel'))}</button>${foot}`;
  let stop = false;
  $('tgc').onclick = () => { stop = true; try { localStorage.removeItem('km_login'); } catch (e) {} TOKEN = ''; boot(); };
  for (let k = 0; k < 400 && !stop; k++) {

      const c = await fetch(API + 'login_check', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code }) }).then((x) => x.json());
      if (c.error) { try { localStorage.removeItem('km_login'); } catch (e) {} if (!stop) { stop = true; boot(); } return; }
      if (c.done && c.token) { TOKEN = c.token; try { localStorage.setItem('km_token', TOKEN); localStorage.removeItem('km_login'); } catch (e) {} haptic('ok'); return start(); }
    } catch (e) {}
    await new Promise((ok) => setTimeout(ok, 2500));
  }
}

  if (IN_TG || TOKEN) return start();
  const qid = new URLSearchParams(location.search).get('q');
  app.innerHTML = `${installBanner()}<div class="heart">${qid ? '👀' : '💛'}</div><h1>${esc(qid ? t('invT0') : t('title'))}</h1><p class="lead">${esc(qid ? t('invSub0') : t('sub'))}</p>
    <input class="inp" id="nm" maxlength="30" placeholder="${esc(t('yourName'))}" autocomplete="given-name"><button class="btn go" id="ngo">${esc(t('goOn'))}</button>
    <button class="btn" id="hvcode" style="margin-top:18px">${esc(t('haveCode'))}</button>
    <button class="btn tg" id="hvtg">${esc(t('haveTg'))}</button>${foot}`;
  $('hvtg').onclick = tgLogin;
  $('hvcode').onclick = () => {
    const d = document.createElement('div'); d.className = 'sheet';
    d.innerHTML = `<div class="in"><h2>${esc(t('codeT'))}</h2><input class="inp" id="rcode" maxlength="6" autocapitalize="characters" autocomplete="off" placeholder="${esc(t('codePh'))}" style="text-align:center;letter-spacing:4px;font-size:22px;text-transform:uppercase"><button class="btn go" id="rgo">${esc(t('codeGo'))}</button></div>`;
    document.body.appendChild(d); d.onclick = (e) => { if (e.target === d) d.remove(); };
    const inp = d.querySelector('#rcode'); setTimeout(() => inp.focus(), 50);
    const go = async () => {
      const code = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); if (code.length !== 6) return toast(t('codeBad'));
      try {
        const res = await fetch(API + 'recover', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code }) });
        const r = await res.json();
        if (!r.token) return toast(r.error === 'slow' ? t('codeSlow') : t('codeBad'));
        TOKEN = r.token; try { localStorage.setItem('km_token', TOKEN); } catch (e) {}
        d.remove(); haptic('ok'); start();
      } catch (e) { toast(t('err')); }
    };
    d.querySelector('#rgo').onclick = go; inp.onkeydown = (e) => { if (e.key === 'Enter') go(); };
  };
  const go = async () => {
    const name = $('nm').value.trim(); if (name.length < 2) return toast(t('nameNeed'));
    $('ngo').disabled = true;
    try { const src = new URLSearchParams(location.search).get('src') || (qid ? 'quiz' : 'web'); const r = await fetch(API + 'guest', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, lang, src }) }).then((x) => x.json()); if (!r.token) throw new Error(); TOKEN = r.token; try { localStorage.setItem('km_token', TOKEN); } catch (e) {} start(); }
    catch (e) { $('ngo').disabled = false; toast(t('err')); }
  };
  $('ngo').onclick = go; $('nm').onkeydown = (e) => { if (e.key === 'Enter') go(); };
}
boot();
</script>
</body>
</html>
